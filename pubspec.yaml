name: cuberun
description: >-
  Kernel-confined launcher for AI coding harnesses: wraps the whole
  harness process tree (pi / omp / fa) in a macOS sandbox-exec Layer-0
  profile resolved from a strict yaml manifest.
version: 0.1.1
homepage: https://github.com/vabhzw17eg2qu4m9-bit/cuberun
repository: https://github.com/vabhzw17eg2qu4m9-bit/cuberun

environment:
  sdk: '>=3.9.0 <4.0.0'

executables:
  cuberun: cuberun

dependencies:
  args: ^2.7.0
  crypto: ^3.0.3
  yaml: ^3.1.3

dev_dependencies:
  coverage: ^1.11.0
  lints: ^6.0.0
  test: ^1.25.0
