name: ci

# Merge rule (GOAL): a red `integration` or `build` job blocks merge even
# when `test` is green; `test` never substitutes for `integration`.
# Skipped(provider) and failed are DIFFERENT colors — the integration job
# reports skips explicitly and never treats them as green passes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --set-exit-if-changed .
      - run: dart analyze --fatal-infos

  test:
    runs-on: macos-15
    # Badge commits (.badges/*.svg) land on main from this job.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: dart test --coverage=coverage
        id: test
        # pipefail keeps a red suite red through the tee; the captured
        # count feeds the badges step (compact reporter: the auto-selected
        # github reporter has no +N counters).
        run: |
          set -o pipefail
          dart test --coverage=coverage --exclude-tags integration \
            --reporter compact 2>&1 | tee /tmp/test_run.log
          COUNT=$(grep -oE '\+[0-9]+' /tmp/test_run.log | tail -1 | tr -d '+' || true)
          echo "test_count=${COUNT:-0}" >> "$GITHUB_OUTPUT"
      - run: dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on lib
      - name: CRAP ratchet (< 10, crap4dart.yaml) + public_docs gate
        run: |
          dart pub global activate crap4dart
          # analyze enforces the threshold (exit 2 on breach); check runs
          # the gates enabled in crap4dart.yaml (public_docs).
          dart pub global run crap4dart analyze
          dart pub global run crap4dart check
      - name: Generate badges
        run: |
          mkdir -p .badges
          TEST_COUNT="${{ steps.test.outputs.test_count }}"
          COV_PCT=$(grep -o 'LH:[0-9]*' coverage/lcov.info | awk -F: '{s+=$2} END{print s}')
          COV_TOTAL=$(grep -o 'LF:[0-9]*' coverage/lcov.info | awk -F: '{s+=$2} END{print s}')
          COV_FINAL=$(echo "scale=1; $COV_PCT * 100 / $COV_TOTAL" | bc 2>/dev/null || echo "0")
          CRAP=$(grep -oE 'threshold: [0-9.]+' crap4dart.yaml | awk '{print $2}')
          curl -s -o .badges/tests.svg \
            "https://img.shields.io/badge/tests-${TEST_COUNT}%20passing-brightgreen"
          curl -s -o .badges/coverage.svg \
            "https://img.shields.io/badge/coverage-${COV_FINAL}%25-brightgreen"
          curl -s -o .badges/crap4dart.svg \
            "https://img.shields.io/badge/crap4dart-${CRAP}%20threshold-green"
      - name: Commit badges
        # Badges belong to main only — on PR branches this would push a
        # stray bot commit to the feature branch mid-review.
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .badges/*.svg || true
          git diff --staged --quiet || git commit -m 'chore: update CI badges [skip ci]'
          git push || true

  integration:
    runs-on: macos-15
    # gh create-verb legs (AC12) open scratch issues/PRs/branches in THIS
    # repo with the workflow token, then tear them down.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: full integration suite (probe + negative control + tool matrices)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: dart test --tags integration
      - name: archive harness transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-artifacts
          path: build/harness-artifacts/
          if-no-files-found: ignore

  build:
    runs-on: macos-15
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: compile single static binary
        run: |
          mkdir -p build
          dart compile exe bin/cube_sandbox.dart -o build/cube-sandbox-macos-arm64
      - name: binary smoke (--version, list, sbpl fa, probe fa)
        run: |
          ./build/cube-sandbox-macos-arm64 --version
          ./build/cube-sandbox-macos-arm64 list
          ./build/cube-sandbox-macos-arm64 sbpl fa > /dev/null
          ./build/cube-sandbox-macos-arm64 probe fa
      - uses: actions/upload-artifact@v4
        with:
          name: cube-sandbox-macos-arm64
          path: build/cube-sandbox-macos-arm64
