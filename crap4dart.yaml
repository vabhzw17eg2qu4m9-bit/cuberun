# crap4dart configuration for cube-sandbox.
# https://github.com/IstiN/crap4dart
#
# RATCHET: CRAP must stay < 10 (owner's pinned rule, not fah's 12) —
# pushes may only make the codebase BETTER. Lower the threshold when
# the top offenders improve (dart pub global run crap4dart analyze).

sources: [lib, bin]

crap:
  enabled: true
  threshold: 9.9

coverage:
  # Pre-commit regenerates this (dart test --coverage) right before the
  # CRAP step; a bare analyze never re-runs tests (run_tests false).
  lcov_path: coverage/lcov.info
  required: true
  branch_coverage: true
  run_tests: false

# 0.9.5 default-enables ALL built-in gates; we own exactly two checks —
# the CRAP ratchet above and public_docs (GOAL: doc comment on every
# public member). Everything else is disabled explicitly so `check`
# means precisely our gate (flutter_agent_harness convention).
gates:
  public_docs: {enabled: true}
  loc: {enabled: false} # no size budget in GOAL
  test_coverage: {enabled: false} # ratchet is CRAP, not a % floor
  complexity: {enabled: false} # subsumed by the CRAP ratchet
  method_size: {enabled: false}
  nesting: {enabled: false}
  class_size: {enabled: false}
  weight_of_class: {enabled: false}
  unused_code: {enabled: false}
  unused_files: {enabled: false}
  banned_imports: {enabled: false}
  duplication: {enabled: false} # cli.dart banner table, deliberate
  file_naming: {enabled: false}
  magic_constants: {enabled: false}
  test_assertions: {enabled: false}
  folder_structure: {enabled: false} # single-file lib/cube_sandbox.dart is idiomatic Dart
  external: {enabled: false}
  golden: {enabled: false} # no Flutter here
  accessibility: {enabled: false} # no Flutter here
  hardcoded_strings: {enabled: false} # no Flutter here
  broken_goldens: {enabled: false} # no Flutter here
